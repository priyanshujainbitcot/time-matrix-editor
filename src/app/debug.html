<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extension Debug</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #0f0;
        }
        .test { margin: 10px 0; padding: 10px; background: #2a2a2a; }
        .pass { border-left: 4px solid #0f0; }
        .fail { border-left: 4px solid #f00; color: #f00; }
        button {
            background: #0066ff;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            margin: 5px;
        }
    </style>
</head>
<body>
    <h1>🔍 Extension Debug Console</h1>
    <div id="tests"></div>
    
    <h2>Actions</h2>
    <button onclick="testIndexedDB()">Test IndexedDB</button>
    <button onclick="window.location.href='index.html'">Go to App</button>
    
    <script>
        const tests = document.getElementById('tests');
        
        function addTest(name, passed, details = '') {
            const div = document.createElement('div');
            div.className = `test ${passed ? 'pass' : 'fail'}`;
            div.innerHTML = `<strong>${passed ? '✅' : '❌'} ${name}</strong><br>${details}`;
            tests.appendChild(div);
            return passed;
        }
        
        // Run tests
        addTest('Window object', typeof window !== 'undefined', 'window exists');
        addTest('Chrome extension protocol', 
            window.location.protocol === 'chrome-extension:', 
            `Protocol: ${window.location.protocol}`
        );
        addTest('Extension ID', 
            window.location.hostname.length > 0,
            `ID: ${window.location.hostname}`
        );
        addTest('IndexedDB available', 
            typeof indexedDB !== 'undefined',
            'indexedDB object exists'
        );
        addTest('crypto.randomUUID', 
            typeof crypto.randomUUID === 'function',
            'UUID generation available'
        );
        addTest('Storage API', 
            typeof chrome !== 'undefined' && chrome.storage,
            'chrome.storage exists'
        );
        
        async function testIndexedDB() {
            try {
                const dbs = await indexedDB.databases();
                addTest('IndexedDB.databases()', true, `Found ${dbs.length} databases: ${JSON.stringify(dbs.map(d => d.name))}`);
                
                // Try to open BristnoteDB
                const request = indexedDB.open('BristnoteDB', 3);
                request.onsuccess = (e) => {
                    const db = e.target.result;
                    addTest('Open BristnoteDB', true, `Version: ${db.version}, Stores: ${Array.from(db.objectStoreNames).join(', ')}`);
                    db.close();
                };
                request.onerror = (e) => {
                    addTest('Open BristnoteDB', false, `Error: ${e.target.error}`);
                };
            } catch (err) {
                addTest('IndexedDB test', false, `Error: ${err.message}`);
            }
        }
        
        // Auto-run IndexedDB test
        setTimeout(testIndexedDB, 500);
    </script>
</body>
</html>
